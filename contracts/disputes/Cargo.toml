[package]
name = "marketpulse-disputes"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
marketpulse-shared = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
marketpulse-shared = { workspace = true }
marketpulse-registry = { workspace = true, features = ["testutils"] }
marketpulse-request-board = { workspace = true, features = ["testutils"] }
proptest = { workspace = true }
