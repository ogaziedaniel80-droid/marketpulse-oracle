[workspace]
resolver = "2"
members = [
    "contracts/shared",
    "contracts/registry",
    "contracts/request-board",
    "contracts/report-engine",
    "contracts/disputes",
    "contracts/oracle-feed",
]

[workspace.dependencies]
soroban-sdk = "28.0.0"
marketpulse-shared = { path = "contracts/shared" }
marketpulse-registry = { path = "contracts/registry" }
marketpulse-request-board = { path = "contracts/request-board" }
marketpulse-oracle-feed = { path = "contracts/oracle-feed" }
proptest = "1.6"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
