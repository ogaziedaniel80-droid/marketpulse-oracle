[project]
name = "marketpulse-evidence-check"
version = "0.1.0"
description = "Off-chain evidence validation, EXIF extraction, perceptual hashing, and tampering heuristics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pillow>=10.2.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
